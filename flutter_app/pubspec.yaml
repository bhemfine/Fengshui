name: inkstone
description: Inkstone — calm, plain-English feng shui, almanac and readings. Android only.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  go_router: ^16.0.0
  google_fonts: ^6.2.1
  # Offline chart engine (Kua, facing, period, checklist rules).
  inkstone_engine:
    path: ../engine
  # Compass for the direction calculator (accelerometer + magnetometer).
  sensors_plus: ^7.1.1
  # Map bearing: OneMap / OpenStreetMap / Esri tiles, keyless. No location permission.
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.6.0
  # Small on-device key/value store (checklist answers only; never synced).
  shared_preferences: ^2.5.6
  # Listing import: renders listing pages that need JavaScript, on the phone only.
  webview_flutter: ^4.14.1
  # Saved home floor plan (app documents folder, never synced).
  path_provider: ^2.1.6
  # Upload your own floor plan (Android photo picker, no storage permission).
  image_picker: ^1.2.4
  # TODO(phase-2): local encrypted storage
  # drift: ^2.22.0
  # sqlcipher_flutter_libs: ^0.6.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # TODO(phase-2): drift_dev: ^2.22.0
  # TODO(phase-2): build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/content/home_checklist.json

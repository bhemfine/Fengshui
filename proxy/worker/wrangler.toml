name = "inkstone-proxy"
main = "src/index.ts"
compatibility_date = "2024-09-23"
workers_dev = false

# Never ship request data to log sinks.
logpush = false

[observability]
enabled = false

# System prompts are bundled as plain-text modules.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# No KV, D1, R2, Durable Objects or Queues. The proxy stores nothing.

[vars]
ANTHROPIC_MODEL = "claude-sonnet-4-5"
# "enforce" in production. "off" only for local dev (wrangler dev).
INTEGRITY_MODE = "enforce"

# Cloudflare Rate Limiting binding. Counters live only inside the limiter window.
[[ratelimits]]
name = "AI_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "MAPS_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# Secrets (set with `wrangler secret put`):
#   ANTHROPIC_API_KEY
#   GOOGLE_MAPS_KEY
